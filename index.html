<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แผนที่ประเทศไทย – ใส่ข้อความและรูปภาพตามจังหวัด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f9;--card:#fff;--text:#1d2433;--muted:#667085;--line:#d9dee7;--brand:#2563eb;--brand-t:#fff;--danger:#d92d20;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--text:#e8ecf3;--muted:#98a2b3;--line:#2e3644;--brand:#4f86f7;--danger:#f97066;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Sarabun,"Noto Sans Thai",Tahoma,sans-serif;font-size:16px;line-height:1.5}
header{padding:18px 24px 6px}
h1{margin:0;font-size:1.5rem}
header p{margin:2px 0 0;color:var(--muted)}
.wrap{display:grid;grid-template-columns:minmax(340px,430px) 1fr;gap:20px;padding:16px 24px 32px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
.panel,.out{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.entry{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;border-left:6px solid var(--c)}
.entry-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}
select,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{margin-top:8px;min-height:90px;resize:vertical;overflow:hidden}
.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:8px 14px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-t);border-color:var(--brand);font-weight:700}
.btn.danger{color:var(--danger)}
.btn.sm{padding:2px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.attach{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.attach input{display:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:0;right:0;border:0;background:rgba(0,0,0,.65);color:#fff;width:20px;height:20px;cursor:pointer;line-height:1;border-radius:0 0 0 6px}
.opts{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.opts label.chk{display:flex;align-items:center;gap:6px;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;border:0;background:var(--card);color:var(--text);padding:4px 12px;cursor:pointer}
.seg button.on{background:var(--brand);color:var(--brand-t);font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.status{margin-top:10px;color:var(--muted);min-height:1.5em}
.out{overflow:auto}
canvas{display:block;width:100%;height:auto;background:#fff;border-radius:8px}
</style>
</head>
<body>
<header>
  <h1>แผนที่ประเทศไทย</h1>
  <p>เลือกจังหวัด ใส่ข้อความ แนบรูปภาพ แล้วกด “ประมวลผล” เพื่อสร้างแผนที่พร้อมเส้นโยง</p>
</header>
<div class="wrap">
  <section class="panel">
    <div class="opts">
      <label class="chk"><input type="checkbox" id="chkAll"> แสดงชื่อจังหวัดอื่นบนแผนที่</label>
      <span>ภาษา:
        <span class="seg"><button id="langTh" class="on">ไทย</button><button id="langEn">English</button></span>
      </span>
    </div>
    <div id="entries"></div>
    <div class="actions">
      <button class="btn" id="btnAdd">+ เพิ่มจังหวัด</button>
      <button class="btn primary" id="btnRun">ประมวลผล</button>
      <button class="btn" id="btnSave" disabled>บันทึกเป็น PNG</button>
      <button class="btn danger" id="btnReset">รีเซ็ต</button>
    </div>
    <div class="status" id="status"></div>
  </section>
  <section class="out"><canvas id="cv"></canvas></section>
</div>

const PALETTE = ['#2563eb','#e11d48','#059669','#d97706','#7c3aed','#0891b2','#c026d3','#65a30d','#ea580c','#475569'];
const FONT = 'Sarabun, "Noto Sans Thai", Tahoma, sans-serif';
let lang = 'th', showAll = false;
const MS = 1.5; // ขยายแผนที่ให้อ่านชื่อได้ชัด
const nm = p => lang==='th' ? p.th : p.n.replace(' Metropolis','');
const sortedProvs = () => DATA.items.slice().sort((a,b)=>nm(a).localeCompare(nm(b),lang==='th'?'th':'en'));
const byName = Object.fromEntries(DATA.items.map(p=>[p.n,p]));
let entries = [], uid = 0, rendered = false;

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');

function newEntry(){ return {id:++uid, prov:'', text:'', imgs:[]}; }

/* ---------- ฟอร์ม ---------- */
function buildEntries(){
  const box = $('entries'); box.innerHTML = '';
  entries.forEach((e,i)=>{
    const d = document.createElement('div');
    d.className = 'entry'; d.style.setProperty('--c', PALETTE[i%PALETTE.length]);
    d.innerHTML = `<div class="entry-h"><span>จังหวัดที่ ${i+1}</span>
      ${entries.length>1?'<button class="btn sm danger" data-del>ลบ</button>':''}</div>
      <select><option value="">— เลือกจังหวัด —</option>${sortedProvs().map(p=>`<option value="${p.n}">${nm(p)}</option>`).join('')}</select>
      <textarea placeholder="พิมพ์ข้อความ (ความยาวไม่จำกัด)"></textarea>
      <div class="attach"><label class="btn sm">แนบรูปภาพ<input type="file" accept="image/*" multiple></label></div>
      <div class="thumbs"></div>`;
    const sel = d.querySelector('select'), ta = d.querySelector('textarea'), fi = d.querySelector('input');
    sel.value = e.prov; ta.value = e.text;
    sel.onchange = ()=>{ e.prov = sel.value; };
    const grow = ()=>{ ta.style.height='auto'; ta.style.height = Math.max(90,ta.scrollHeight+2)+'px'; };
    ta.oninput = ()=>{ e.text = ta.value; grow(); };
    fi.onchange = ()=>{
      [...fi.files].forEach(f=>{
        const r = new FileReader();
        r.onload = ()=>{ const im = new Image(); im.onload = ()=>{ e.imgs.push({src:r.result, el:im}); buildThumbs(d,e); }; im.src = r.result; };
        r.readAsDataURL(f);
      });
      fi.value = '';
    };
    const del = d.querySelector('[data-del]');
    if(del) del.onclick = ()=>{ entries = entries.filter(x=>x!==e); buildEntries(); };
    box.appendChild(d); buildThumbs(d,e); grow();
  });
}
function buildThumbs(d,e){
  const t = d.querySelector('.thumbs'); t.innerHTML = '';
  e.imgs.forEach((im,k)=>{
    const w = document.createElement('div'); w.className = 'thumb';
    w.innerHTML = `<img src="${im.src}" alt=""><button title="ลบรูป">×</button>`;
    w.querySelector('button').onclick = ()=>{ e.imgs.splice(k,1); buildThumbs(d,e); };
    t.appendChild(w);
  });
}

/* ---------- วาดแผนที่ ---------- */
function rr(c,x,y,w,h,r){
  c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function wrap(c,text,maxW){
  const seg = (window.Intl && Intl.Segmenter) ? new Intl.Segmenter('th',{granularity:'word'}) : null;
  const out = [];
  for(const para of text.split('\n')){
    if(para===''){ out.push(''); continue; }
    let toks = seg ? Array.from(seg.segment(para),s=>s.segment) : Array.from(para);
    toks = toks.flatMap(t=> c.measureText(t).width>maxW ? Array.from(t) : [t]);
    let line = '';
    for(const t of toks){
      if(line!=='' && c.measureText(line+t).width>maxW){ out.push(line.trimEnd()); line = t.trimStart(); }
      else line += t;
    }
    out.push(line);
  }
  return out;
}
function mapPath(c,p,ox,oy){
  c.beginPath();
  for(const poly of p.p) for(const ring of poly){
    c.moveTo(ring[0]*MS+ox, ring[1]*MS+oy);
    for(let i=2;i<ring.length;i+=2) c.lineTo(ring[i]*MS+ox, ring[i+1]*MS+oy);
    c.closePath();
  }
}

async function draw(baseOnly){
  try{ await Promise.all([document.fonts.load('17px Sarabun'),document.fonts.load('700 20px Sarabun')]); }catch(_){}
  const items = [];
  entries.forEach((e,i)=>{ if(e.prov && !baseOnly) items.push({e, i, p:byName[e.prov], color:PALETTE[i%PALETTE.length]}); });

  const M=40, BW=400, GAP=80, PAD=14, LH=26, TH=30, MAPW=DATA.W*MS, MAPH=DATA.H*MS;
  const mc = document.createElement('canvas').getContext('2d');
  mc.font = `17px ${FONT}`;

  // วัดขนาดกล่อง
  items.forEach(it=>{
    it.lines = it.e.text.trim() ? wrap(mc, it.e.text.trim(), BW-2*PAD) : [];
    it.pics = it.e.imgs.map(im=>{
      let w = BW-2*PAD, h = w*im.el.naturalHeight/im.el.naturalWidth;
      if(h>520){ h = 520; w = h*im.el.naturalWidth/im.el.naturalHeight; }
      return {el:im.el, w, h};
    });
    it.h = PAD + TH + (it.lines.length? it.lines.length*LH+8 : 0) + it.pics.reduce((s,p)=>s+p.h+10,0) + PAD - (it.pics.length||it.lines.length?0:0);
    it.cx = it.p.cx*MS; it.cy = it.p.cy*MS;
  });

  // แบ่งซ้าย/ขวา
  const L=[], R=[];
  [...items].sort((a,b)=>a.cx-b.cx).forEach(it=>{
    const mid = MAPW/2, near = Math.abs(it.cx-mid) < MAPW*0.15;
    if(near) (L.length<=R.length?L:R).push(it); else (it.cx<mid?L:R).push(it);
  });
  const leftW = L.length ? BW+GAP : 0, rightW = R.length ? BW+GAP : 0;
  const ox = M+leftW, oy = M;
  const place = (col,side)=>{
    col.sort((a,b)=>a.cy-b.cy);
    let prev = M-20;
    col.forEach(it=>{
      it.side = side;
      it.top = Math.max(oy+it.cy-it.h/2, prev+20, M);
      prev = it.top+it.h;
      it.bx = side==='L' ? M : ox+MAPW+GAP;
    });
    return prev;
  };
  const endL = place(L,'L'), endR = place(R,'R');
  const W = M+leftW+MAPW+rightW+M;
  const H = Math.max(M+MAPH+M, endL+M, endR+M);

  const scale = Math.min(2, 16000/Math.max(W,H));
  cv.width = Math.round(W*scale); cv.height = Math.round(H*scale);
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H);

  // แผนที่
  const sel = Object.fromEntries(items.map(it=>[it.p.n,it]));
  ctx.lineJoin = 'round';
  DATA.items.forEach(p=>{
    mapPath(ctx,p,ox,oy);
    ctx.fillStyle = sel[p.n] ? sel[p.n].color+'cc' : '#e3e7ed';
    ctx.fill('evenodd');
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
  });
  DATA.items.forEach(p=>{ if(sel[p.n]){ mapPath(ctx,p,ox,oy); ctx.strokeStyle = sel[p.n].color; ctx.lineWidth = 1.6; ctx.stroke(); } });

  // เส้นโยง
  items.forEach(it=>{
    const px = ox+it.cx, py = oy+it.cy;
    const ax = it.side==='L' ? it.bx+BW : it.bx, ay = it.top+TH/2+PAD/2;
    const dx = (px-ax)*0.5;
    ctx.strokeStyle = it.color; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.bezierCurveTo(ax+dx,ay,px-dx,py,px,py); ctx.stroke();
  });
  items.forEach(it=>{
    const px = ox+it.cx, py = oy+it.cy;
    ctx.fillStyle = it.color; ctx.beginPath(); ctx.arc(px,py,11,0,7); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = `700 13px ${FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(String(it.i+1), px, py+1);
  });

  // ชื่อจังหวัดบนแผนที่
  if(showAll){
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round';
    DATA.items.forEach(p=>{
      const s = sel[p.n], x = ox+p.cx*MS, y = oy+p.cy*MS+(s?18:0);
      ctx.font = `${s?'700 ':''}11px ${FONT}`;
      ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3; ctx.strokeText(nm(p),x,y);
      ctx.fillStyle = s ? s.color : '#3b4352'; ctx.fillText(nm(p),x,y);
    });
  }

  // กล่องข้อความ + รูป
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  items.forEach(it=>{
    rr(ctx,it.bx,it.top,BW,it.h,12); ctx.fillStyle='#fff'; ctx.fill();
    ctx.strokeStyle = it.color; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = it.color; ctx.font = `700 20px ${FONT}`;
    ctx.fillText(`${it.i+1}. ${nm(it.p)}`, it.bx+PAD, it.top+PAD-2);
    let y = it.top+PAD+TH;
    ctx.fillStyle = '#1d2433'; ctx.font = `17px ${FONT}`;
    it.lines.forEach(l=>{ ctx.fillText(l, it.bx+PAD, y); y += LH; });
    if(it.lines.length) y += 8;
    it.pics.forEach(p=>{
      const x = it.bx+(BW-p.w)/2;
      ctx.save(); rr(ctx,x,y,p.w,p.h,8); ctx.clip(); ctx.drawImage(p.el,x,y,p.w,p.h); ctx.restore();
      y += p.h+10;
    });
  });
  return items.length;
}

/* ---------- ปุ่ม ---------- */
$('chkAll').onchange = e=>{ showAll = e.target.checked; draw(!rendered); };
function setLang(l){
  lang = l; $('langTh').classList.toggle('on',l==='th'); $('langEn').classList.toggle('on',l==='en');
  buildEntries(); draw(!rendered);
}
$('langTh').onclick = ()=>setLang('th');
$('langEn').onclick = ()=>setLang('en');
$('btnAdd').onclick = ()=>{ entries.push(newEntry()); buildEntries(); };
$('btnRun').onclick = async ()=>{
  const n = await draw();
  $('status').textContent = n ? `แสดงผล ${n} จังหวัดแล้ว` : 'กรุณาเลือกจังหวัดอย่างน้อย 1 จังหวัด';
  rendered = n>0; $('btnSave').disabled = !rendered;
};
$('btnSave').onclick = ()=>{
  cv.toBlob(b=>{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = 'thailand-map.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  },'image/png');
};
$('btnReset').onclick = async ()=>{
  entries = [newEntry()]; buildEntries(); rendered = false;
  $('btnSave').disabled = true; $('status').textContent = ''; await draw(true);
};

entries = [newEntry()]; buildEntries(); draw();
</script>
